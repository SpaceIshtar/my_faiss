# TurboQuantMSE-style configuration for HNSW/L2 experiments
# This benchmarked variant uses the rotation + scalar quantization stage
# that maps most directly onto the current L2 HNSW framework.
#
# Format:
# [dataset_name]
# bits=value,seed=value

[sift1M]
bits=1,seed=1234,mode=mse
bits=4,seed=1234,mode=mse
bits=8,seed=1234,mode=mse

[gist1M]
